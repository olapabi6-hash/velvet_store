<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Velvet Set</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;
  justify-content:center;align-items:center;
  background:linear-gradient(135deg,#fff7f2,#ffe4e8,#fff0c9);
  font-family:Arial,sans-serif;color:#553943;padding:20px
}
.card{
  width:100%;max-width:390px;background:#fffdfb;
  padding:32px;border-radius:24px;
  box-shadow:0 12px 35px #a76c7725;text-align:center
}
.logo{font-size:30px;font-weight:bold;color:#b65f7a;margin-bottom:8px}
.subtitle{color:#987b83;font-size:14px;margin-bottom:26px}
label{display:block;text-align:left;font-size:14px;margin:14px 0 7px}
input{
  width:100%;padding:13px;border:1px solid #f0cbd4;
  border-radius:12px;outline:none;font-size:15px
}
input:focus{border-color:#d984a0}
button{
  width:100%;padding:14px;border:0;border-radius:12px;
  background:#d984a0;color:white;font-size:16px;
  font-weight:bold;cursor:pointer;margin-top:22px
}
button:hover{background:#c86e8c}
.message{font-size:13px;margin-top:14px;min-height:16px}
.back{display:inline-block;margin-top:20px;color:#a85875;text-decoration:none;font-size:14px}
.hint{font-size:12px;color:#9a858a;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">♡ Velvet Set</div>
  <div class="subtitle">Welcome back! Login dulu, yuk ✨</div>

  <form id="login-form">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Masukkan username" required>

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Masukkan password" required>

    <button type="submit">Login</button>
    <div class="message" id="message"></div>
  </form>

  <a class="back" href="velvet.store.html">← Kembali ke toko</a>
  <div class="hint">Demo login: velvet / 12345</div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", function(event) {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  if (username === "velvet" && password === "12345") {
    localStorage.setItem("velvetLoggedIn", "true");
    localStorage.setItem("velvetUsername", username);

    message.style.color = "#42845a";
    message.textContent = "Login berhasil! Mengalihkan ke toko...";

    setTimeout(function() {
      window.location.href = "velvet.store.html";
    }, 700);
  } else {
    message.style.color = "#bd4564";
    message.textContent = "Username atau password salah!";
  }
});
</script>
</body>
</html>
